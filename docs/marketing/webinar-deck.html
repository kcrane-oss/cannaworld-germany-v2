<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CannaWorld · Thailand→EU Export Readiness — Webinar Deck</title>
<style>
  :root{
    --bg:#040b10; --bg2:#07151c; --cyan:#22d3ee; --emerald:#34d399;
    --ink:#e8fbff; --mut:#7fa8b5; --line:rgba(52,211,153,.18); --card:rgba(8,22,28,.72);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 600px at 78% -10%,rgba(34,211,238,.16),transparent 60%),
      radial-gradient(800px 600px at 8% 110%,rgba(52,211,153,.14),transparent 60%),
      var(--bg);
    color:var(--ink); overflow:hidden;
  }
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}
  .slide{
    position:absolute;inset:5vh 6vw;display:none;flex-direction:column;justify-content:center;
    border:1px solid var(--line);border-radius:22px;
    background:linear-gradient(160deg,var(--card),rgba(4,11,16,.85));
    box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);
    padding:clamp(28px,5vw,72px);backdrop-filter:blur(8px);overflow:auto;
  }
  .slide.on{display:flex;animation:in .4s ease}
  @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .kick{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:18px}
  h1{font-size:clamp(2rem,5.2vw,4rem);line-height:1.04;margin:0 0 18px;font-weight:800;
     background:linear-gradient(100deg,#fff,var(--cyan) 55%,var(--emerald));-webkit-background-clip:text;background-clip:text;color:transparent}
  h2{font-size:clamp(1.5rem,3.6vw,2.6rem);line-height:1.1;margin:0 0 22px;font-weight:800}
  p.lead{font-size:clamp(1.05rem,1.8vw,1.5rem);color:var(--mut);max-width:60ch;margin:.2em 0}
  .big{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:800;line-height:1.2;max-width:24ch}
  .big em{font-style:normal;color:var(--emerald)}
  ul{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:14px;max-width:62ch}
  li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(1rem,1.7vw,1.35rem);line-height:1.35}
  li .n{flex:0 0 auto;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
        font-weight:800;font-size:.95rem;color:#04121a;background:linear-gradient(135deg,var(--cyan),var(--emerald))}
  li .dot{flex:0 0 auto;width:10px;height:10px;border-radius:3px;margin-top:.55em;background:var(--emerald);box-shadow:0 0 12px var(--emerald)}
  .sub{color:var(--mut);font-size:.92em;font-weight:500}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px;max-width:none}
  .card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;background:rgba(4,12,17,.6)}
  .card h3{margin:0 0 8px;font-size:1.05rem;color:var(--cyan)}
  .card p{margin:0;color:var(--mut);font-size:.98rem;line-height:1.4}
  table{border-collapse:collapse;width:100%;max-width:70ch;font-size:clamp(.85rem,1.4vw,1.05rem)}
  th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
  th{color:var(--cyan);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
  .pill{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--emerald);font-size:.85rem;font-weight:700;margin-bottom:22px}
  .cta{display:grid;gap:12px;margin-top:8px;max-width:54ch}
  .cta a,.cta span{font-size:clamp(1.05rem,1.9vw,1.5rem);font-weight:700;color:var(--ink);text-decoration:none}
  .cta .row{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px 18px;background:rgba(4,12,17,.6)}
  .cta .ic{font-size:1.3rem}
  .foot{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;
         padding:14px 26px;font-size:.8rem;color:var(--mut);border-top:1px solid var(--line);background:rgba(4,11,16,.6)}
  .brand{font-weight:800;letter-spacing:.04em}
  .brand b{color:var(--cyan)}
  .nav{display:flex;gap:10px;align-items:center}
  .nav button{background:rgba(34,211,238,.1);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:7px 13px;font-size:.95rem;cursor:pointer}
  .nav button:hover{background:rgba(34,211,238,.22)}
  .disc{font-size:.82rem;color:var(--mut);margin-top:26px;border-left:2px solid var(--line);padding-left:14px;max-width:54ch}
  .map{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}
  .map .node{border:1px solid var(--line);border-radius:11px;padding:12px 16px;font-weight:700;font-size:.95rem;background:rgba(4,12,17,.6)}
  .map .arr{color:var(--cyan);font-size:1.3rem}
  .kpi{display:flex;gap:34px;flex-wrap:wrap;margin-top:14px}
  .kpi div{min-width:160px}
  .kpi .v{font-size:clamp(2rem,4vw,3.2rem);font-weight:800;background:linear-gradient(100deg,var(--cyan),var(--emerald));-webkit-background-clip:text;background-clip:text;color:transparent}
  .kpi .l{color:var(--mut);font-size:.95rem}
  @media(max-width:720px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>

<div class="foot">
  <div class="brand">Canna<b>World</b> · Thailand→EU Export Readiness</div>
  <div class="nav">
    <button onclick="go(-1)">◀</button>
    <span id="count" style="min-width:64px;text-align:center"></span>
    <button onclick="go(1)">▶</button>
  </div>
</div>

<script>
const S = [
 {h:'title'},
 {kick:'Setup',h2:'Bevor wir starten',ul:[
   ['•','B2B-Information — kein Rechtsrat.'],
   ['•','Die Session wird aufgezeichnet, Link folgt.'],
   ['•','Fragen jederzeit in den Chat — Q&A am Ende.']],
   disc:'Zielgruppe: Apotheken, Großhändler, Importeure, Hersteller, Regulatory/QP.'},
 {kick:'Der Haken',big:'„Das Produkt war da. Der Preis stimmte. Trotzdem bewegte sich <em>nichts</em>."'},
 {kick:'Die These',h1:'Der Engpass ist Compliance — nicht Supply.',
   lead:'Thailands Kosten- und Kapazitätsvorteil zählt erst, wenn die Charge eine lückenlose Dokumentenstrecke durchläuft. Vor dem Versand.'},
 {kick:'Übersicht',h2:'Der Pfad in 6 Stationen',
   map:['CoA','GMP / EU-GMP','Importgenehmigung','GDP-Logistik','Audit-Passport','Zielmarkt']},
 {kick:'Station 1',h2:'Certificate of Analysis (CoA)',ul:[
   ['1','Pro Charge, von akkreditiertem Labor.'],
   ['2','Der Ausgangsnachweis für Qualität & Identität.'],
   ['3','Chargennummer muss mit allem anderen matchen — sonst beginnt das Problem hier.']]},
 {kick:'Station 2',h2:'GMP ≠ EU-GMP',ul:[
   ['1','GMP = guter Herstellungsstandard (global, breit).'],
   ['2','EU-GMP = von EU-Behörde anerkannt → Voraussetzung für EU-Import.'],
   ['3','Das häufigste, teuerste Missverständnis im ganzen Prozess.']]},
 {kick:'Station 3',h2:'Importgenehmigung',ul:[
   ['1','Muss exakt zur tatsächlichen Charge passen.'],
   ['2','Überraschend viele Sendungen scheitern an vermeidbaren Details.'],
   ['3','Genehmigung ↔ CoA ↔ Lieferschein: alle Nummern identisch.']]},
 {kick:'Station 4',h2:'GDP-konforme Logistik',ul:[
   ['1','Kühlkette, Monitoring, lückenlose Übergaben.'],
   ['2','Gute Dokumente nützen nichts, wenn der Transport sie nicht hält.'],
   ['3','Temperatur-Logging über die gesamte Strecke.']]},
 {kick:'Station 5',h2:'Audit-Passport',ul:[
   ['•','„Unterlagen liegen irgendwo" — vs. —'],
   ['•','„Jede Charge ist auf Knopfdruck prüfbar."'],
   ['•','Zentral, versioniert, für externe Prüfer nachvollziehbar.']]},
 {kick:'Station 6',h2:'Zielmarkt-Spezifika',
   table:[['Markt','Mindeststandard','Besonderheit'],
     ['Deutschland','EU-GMP','CoA · GMP-Cert · Importgenehmigung'],
     ['EU (allg.)','EU-GMP / GMP','+ Produktspezifikation'],
     ['Italien','EU-GMP','+ AIFA · ministerielle Chargenfreigabe · THC mg/g']]},
 {kick:'Worauf es bricht',h2:'Die 5 häufigsten Stopp-Gründe',ul:[
   ['1','Chargennummern stimmen nicht überein.'],
   ['2','GMP ≠ EU-GMP übersehen.'],
   ['3','Importgenehmigung passt nicht zur Charge.'],
   ['4','GDP-Lücke im Transport.'],
   ['5','Zielmarkt-Sonderanforderung nicht erfüllt.']]},
 {kick:'Die Lösung',h2:'Ein Korridor als Prozess',grid:[
   ['Gateway','Qualifizierung & Dokumenten-Review vor dem Versand.'],
   ['Verifizierung','Charge end-to-end prüfbar — CoA bis Genehmigung.'],
   ['Audit-Passport','Auditfeste Nachverfolgbarkeit je Charge.'],
   ['Marktzugang','Thailand → Deutschland/EU, ein geprüfter Pfad.']]},
 {kick:'Belege',h2:'Was wir messen',kpi:[
   ['[ X Tg ]','Ø Transitzeit TH→EU'],['[ X % ]','Chargen erstgenehmigt'],['[ X % ]','Audit-Pass-Rate']],
   disc:'Platzhalter mit echten, anonymisierten Korridor-Kennzahlen füllen.'},
 {kick:'Nächster Schritt',h2:'Was du jetzt tun kannst',cta:[
   ['📄','EU-GMP Import-Readiness Checkliste — kostenlos'],
   ['🤝','Korridor-Bewertung: cannaworld-thailand.com/import'],
   ['📬','Newsletter „The Compliant Corridor" abonnieren']]},
 {kick:'Danke',h1:'Fragen?',lead:'[Dein Name] · Founder, CannaWorld · cannaworld-thailand.com — B2B-Information, kein Rechtsrat.'}
];

const stage = document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';d.dataset.i=i;
  let html='';
  if(s.h==='title'){
    html=`<div class="pill">Live-Webinar · online · B2B</div>
      <h1>Thailand→EU<br>Export Readiness</h1>
      <p class="lead">Der Dokumentenpfad, der an der EU-Grenze hält — und die 5 häufigsten Stopp-Gründe.</p>
      <p class="lead" style="margin-top:24px;color:var(--ink);font-weight:700">[Datum] · [Dein Name], CannaWorld</p>`;
  }else{
    if(s.kick)html+=`<div class="kick">${s.kick}</div>`;
    if(s.h1)html+=`<h1>${s.h1}</h1>`;
    if(s.h2)html+=`<h2>${s.h2}</h2>`;
    if(s.big)html+=`<div class="big">${s.big}</div>`;
    if(s.lead)html+=`<p class="lead">${s.lead}</p>`;
    if(s.map){html+=`<div class="map">`+s.map.map((n,k)=>`<span class="node">${k+1}. ${n}</span>`+(k<s.map.length-1?'<span class="arr">→</span>':'')).join('')+`</div>`;}
    if(s.ul){html+=`<ul>`+s.ul.map(([n,t])=>`<li>${n==='•'?'<span class="dot"></span>':`<span class="n">${n}</span>`}<span>${t}</span></li>`).join('')+`</ul>`;}
    if(s.grid){html+=`<div class="grid2">`+s.grid.map(([h,p])=>`<div class="card"><h3>${h}</h3><p>${p}</p></div>`).join('')+`</div>`;}
    if(s.kpi){html+=`<div class="kpi">`+s.kpi.map(([v,l])=>`<div><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')+`</div>`;}
    if(s.cta){html+=`<div class="cta">`+s.cta.map(([ic,t])=>`<div class="row"><span class="ic">${ic}</span><span>${t}</span></div>`).join('')+`</div>`;}
    if(s.table){html+=`<table>`+s.table.map((r,k)=>`<tr>`+r.map(c=>k===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')+`</tr>`).join('')+`</table>`;}
    if(s.disc)html+=`<div class="disc">${s.disc}</div>`;
  }
  d.innerHTML=html;stage.appendChild(d);
});

let cur=0;const slides=[...document.querySelectorAll('.slide')];
function show(i){slides.forEach(s=>s.classList.remove('on'));cur=Math.max(0,Math.min(slides.length-1,i));
  slides[cur].classList.add('on');document.getElementById('count').textContent=(cur+1)+' / '+slides.length;}
function go(d){show(cur+d);}
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){go(1);e.preventDefault();}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){go(-1);e.preventDefault();}
  if(e.key==='Home')show(0); if(e.key==='End')show(slides.length-1);
});
show(0);
</script>
</body>
</html>
