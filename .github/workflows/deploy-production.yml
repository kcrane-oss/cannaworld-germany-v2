name: Deploy Production (Vercel)

# Automated, repeatable production deploy for cannaworld-germany.de.
#
# Replaces the previous ad-hoc `vercel --prod` uploads from a local machine:
# every push to master (a merge made by Claude Code or OpenClaw) now builds
# with the live project's production env vars and ships to the live Vercel
# project. OpenClaw can also run scripts/deploy-prod.sh locally for the same
# result.
#
# One-time setup (GitHub → Settings → Secrets and variables → Actions):
#   - secret  VERCEL_TOKEN   : a Vercel access token with deploy rights
# Project/org IDs below are not secret (they identify the live project).

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # cw-germany-final-public-v100  →  cannaworld-germany.de / www.cannaworld-germany.de
  VERCEL_ORG_ID: team_3iEs5XA0LAgcHxWzWq3SfSUJ
  VERCEL_PROJECT_ID: prj_tedvOhFjpxDgdFKYPGLTZdrmKHsS

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Pull production project settings + env vars
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build with production env baked in
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Guard - production build must not contain the dev BtM salt
        run: |
          if grep -rqF "DEV_SALT_REPLACE_IN_PROD" .vercel/output; then
            echo "::error::VITE_BTM_SALT is not set in the Vercel production env - the build still carries the dev BtM salt placeholder. Aborting before go-live."
            exit 1
          fi
          echo "BtM salt guard passed: no dev placeholder in build output."
      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
